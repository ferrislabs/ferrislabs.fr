{{- range $app := .Values.apps }}
{{- if and $.Values.gatewayApi.enabled $app.enabled $app.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ferrislabs.fullname" $ }}-{{ $app.name }}
  labels:
    {{- include "ferrislabs.labels" (dict "root" $ "app" $app) | nindent 4 }}
  annotations:
    {{- with $.Values.gatewayApi.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $app.httpRoute.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    {{- if $.Values.gatewayApi.parentRefs }}
    {{- range $.Values.gatewayApi.parentRefs }}
    - name: {{ .name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
    {{- else }}
    - name: {{ include "ferrislabs.fullname" $ }}
    {{- end }}
  hostnames:
    {{- toYaml $app.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: {{ $app.httpRoute.pathType }}
            value: {{ $app.httpRoute.path }}
      backendRefs:
        - name: {{ include "ferrislabs.fullname" $ }}-{{ $app.name }}
          port: {{ $app.service.port }}
{{- end }}
{{- end }}
