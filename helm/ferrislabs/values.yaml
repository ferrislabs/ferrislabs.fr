nameOverride: ""
fullnameOverride: ""

commonLabels: {}

imagePullSecrets: []

podAnnotations: {}

deploymentStrategy:
  type: RollingUpdate

serviceAccount:
  create: false
  annotations: {}
  name: ""

ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true

# Kubernetes Gateway API support, as an alternative or complement to ingress.
gatewayApi:
  enabled: true
  annotations: {}

  # References to the Gateway(s) each HTTPRoute attaches to.
  # Attaches to the pre-existing "ferrislabs-gateway" Gateway (namespace default).
  # Leave empty to attach to the Gateway created below (gateway.create: true).
  parentRefs:
    - name: ferrislabs-gateway
      namespace: default

  # Optionally have this chart create the Gateway resource itself.
  # Set to false to attach to a Gateway managed elsewhere in the cluster.
  gateway:
    create: false
    gatewayClassName: traefik
    annotations: {}
    listeners:
      - name: http
        protocol: HTTP
        port: 80
        allowedRoutes:
          namespaces:
            from: Same

apps:
  - name: website
    enabled: true
    replicaCount: 1

    image:
      repository: ghcr.io/ferrislabs/ferrislabs-website
      tag: sha-94b6859
      pullPolicy: IfNotPresent

    containerPort: 8080

    command: []
    args: []

    env: []
    envFrom: []

    podAnnotations: {}
    podLabels: {}

    resources: {}

    nodeSelector: {}
    tolerations: []
    affinity: {}

    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
      annotations: {}

    ingress:
      enabled: false
      host: ferrislabs.fr
      path: /
      pathType: Prefix
      annotations: {}
      tls:
        enabled: true
        secretName: ferrislabs-fr-tls

    httpRoute:
      enabled: true
      hostnames:
        - landing.ferrislabs.fr
        - ferrislabs.fr
      path: /
      pathType: PathPrefix
      annotations: {}

    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 20

    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
